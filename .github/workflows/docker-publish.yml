name: Build & Publish (GHCR)

# Builds the Docker image and pushes it to GitHub Container Registry.
# The VPS pulls the image with `docker compose -f compose.prod.yaml pull`
# (no SSH from CI to the VPS — credentials stay on the box).
#
# Tags produced:
#   ghcr.io/allanbarcelos/mapos-dotnet:latest        (only on main)
#   ghcr.io/allanbarcelos/mapos-dotnet:main          (branch ref)
#   ghcr.io/allanbarcelos/mapos-dotnet:sha-<short>   (immutable, use this in prod for safety)
#   ghcr.io/allanbarcelos/mapos-dotnet:v1.2.3        (when you push a v* tag)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Executa apenas quando arquivos que afetam o build são alterados.
    # Mudanças em .md, docs/, nginx.conf, install.sh, etc. não disparam novo build.
    # Obs.: filtros de path são ignorados em pushes de tag — tags sempre executam.
    paths:
      - "**/*.cs"
      - "**/*.cshtml"
      - "**/*.csproj"
      - "**/*.sln"
      - "appsettings*.json"
      - "wwwroot/**"
      - "Dockerfile"
      - "package*.json"
      - "tailwind.config.js"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Vulnerability scan — blocks the publish on any known CVE ────────────────
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore packages
        run: dotnet restore mapos-dotnet.csproj

      - name: Scan for vulnerable NuGet packages
        run: |
          OUTPUT=$(dotnet list mapos-dotnet.csproj package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found — publish blocked."
            exit 1
          fi
          echo "No known vulnerabilities."

  # ── Build & push to GHCR ─────────────────────────────────────────────────────
  build-push:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=mapos-dotnet
            org.opencontainers.image.description=MapOS .Net (.NET 9 + SignalR)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Summary
        run: |
          echo "### Pushed image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "On the VPS, run: \`cd /opt/mapos-dotnet && docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d\`" >> $GITHUB_STEP_SUMMARY
